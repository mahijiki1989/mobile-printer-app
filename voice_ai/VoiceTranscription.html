<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Voice Transcription — Hindi + English</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1d2e;--bg3:#13151f;--blue:#4f8ef7;--purp:#7c3aed;--red:#ef4444;--green:#22c55e;--yel:#f59e0b;--white:#e8eaf0;--grey:#8892a4;--dim:#4a5568;--border:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--white);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#1d4ed8,var(--purp));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.logo h1{font-size:1rem;font-weight:700}
.logo p{font-size:.68rem;color:var(--grey);margin-top:1px}
.header-btns{display:flex;gap:6px;align-items:center}
.lang-btn{padding:4px 10px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:none;color:var(--grey);font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}
.lang-btn.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.lang-btn:not(.active):hover{background:rgba(255,255,255,.05);color:var(--white)}
.status-bar{background:#111827;padding:5px 16px;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--grey);flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.status-dot.listening{background:var(--blue);animation:blink 1s infinite}
.status-dot.error{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live-bar{background:#0d1933;padding:7px 16px;display:flex;align-items:center;gap:8px;min-height:34px;flex-shrink:0;overflow:hidden}
.live-label{font-size:.65rem;font-weight:800;color:var(--blue);letter-spacing:.5px;flex-shrink:0}
#liveText{font-size:.85rem;color:var(--grey);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tool-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.03);color:var(--grey);font-size:.73rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.tool-btn:hover{background:rgba(255,255,255,.07);color:var(--white);border-color:rgba(255,255,255,.15)}
.tool-btn.active{background:rgba(79,142,247,.12);color:var(--blue);border-color:var(--blue)}
.tool-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.text-area{flex:1;overflow-y:auto;padding:12px 16px}
#transcript{width:100%;height:100%;min-height:100%;font-family:'Segoe UI',sans-serif;font-size:1.05rem;line-height:1.9;color:var(--white);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;resize:none;outline:none;transition:border-color .3s}
#transcript:focus{border-color:var(--blue)}
#transcript::placeholder{color:var(--dim)}
#transcript::selection{background:rgba(79,142,247,.3)}
.word-count{text-align:right;padding:3px 16px;font-size:.73rem;color:var(--dim);flex-shrink:0}
footer{background:var(--bg2);padding:10px 16px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#timer{font-family:Consolas,monospace;font-size:.85rem;color:var(--dim);min-width:44px;transition:color .3s}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Segoe UI',sans-serif;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-clear{background:#2d1b1b;color:#f87171}
.btn-clear:hover{background:#3d2020}
.btn-copy{background:#1a2d1a;color:#4ade80}
.btn-copy:hover{background:#1f381f}
.btn-undo{background:#1b2d2d;color:#67e8f9}
.btn-undo:hover{background:#1f3838}
.btn-mic{margin-left:auto;padding:10px 24px;font-size:.95rem;background:linear-gradient(135deg,var(--purp),var(--blue));color:#fff;border-radius:10px;box-shadow:0 4px 15px rgba(124,58,237,.35);letter-spacing:.3px}
.btn-mic:hover{opacity:.92;transform:translateY(-1px)}
.btn-mic.recording{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 4px 18px rgba(239,68,68,.5);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 15px rgba(239,68,68,.4)}50%{box-shadow:0 4px 28px rgba(239,68,68,.75)}}
.shortcuts{font-size:.68rem;color:var(--dim);margin-left:8px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e3a5f;color:#93c5fd;padding:8px 16px;border-radius:8px;font-size:.82rem;opacity:0;transition:all .3s;pointer-events:none;z-index:100;border:1px solid rgba(147,197,253,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){
  header{padding:10px 12px}
  .logo h1{font-size:.9rem}
  .logo p{display:none}
  .toolbar{padding:5px 12px}
  .text-area{padding:8px 12px}
  #transcript{font-size:.95rem;padding:12px}
  footer{padding:8px 12px;gap:6px}
  .btn{padding:6px 10px;font-size:.78rem}
  .btn-mic{padding:9px 16px;font-size:.88rem}
  .shortcuts{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🎙️</div>
    <div><h1>Voice Transcription</h1><p>Bolein → Likhega → Sahi karega</p></div>
  </div>
  <div class="header-btns">
    <button class="lang-btn active" id="btnHi" onclick="setLang('hi-IN')">हिंदी</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en-US')">English</button>
  </div>
</header>
<div class="status-bar"><span class="status-dot" id="statusDot"></span><span id="statusText">Taiyaar — Bolein button dabayein ya SPACE</span></div>
<div class="live-bar"><span class="live-label">LIVE</span><span id="liveText">Mic button dabayein...</span></div>
<div class="toolbar">
  <button class="tool-btn active" id="autoCorrectBtn" onclick="toggleAutoCorrect()">✨ Auto-Correct</button>
  <span class="tool-sep"></span>
  <button class="tool-btn" onclick="addPunc('।')">। Purna Viram</button>
  <button class="tool-btn" onclick="addPunc('\n')">↵ New Line</button>
  <button class="tool-btn" onclick="addPunc(', ')">Comma</button>
  <button class="tool-btn" onclick="addPunc('? ')">?</button>
</div>
<div class="text-area">
  <textarea id="transcript" placeholder="Yahan aapki baat likhti jaayegi...&#10;&#10;🎤 Bolein button dabayein aur bolna shuru karein.&#10;Hindi ya English — dono kaam karenge.&#10;Jitna chahein bolte rahein — koi time limit nahi!&#10;&#10;✨ Auto-Correct ON — galat words apne aap sahi honge&#10;📝 Text pe click karke manually bhi edit kar sakte hain"></textarea>
</div>
<div class="word-count" id="wordCount">0 words | 0 chars</div>
<footer>
  <span id="timer">0:00</span>
  <button class="btn btn-undo" onclick="undoLast()">↩ Undo</button>
  <button class="btn btn-clear" onclick="clearAll()">🗑 Clear</button>
  <button class="btn btn-copy" id="copyBtn" onclick="copyAll()">📋 Copy</button>
  <span class="shortcuts">Space=Bolein/Rokein | Ctrl+Z=Undo</span>
  <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎤 Bolein</button>
</footer>
<div class="toast" id="toast"></div>
<script>
'use strict';
let isListening=false,recognition=null,fullText='',timerSec=0,timerInterval=null,currentLang='hi-IN',autoCorrectOn=true,history=[];

const corrections={
  'namaste':'नमस्ते','namaskar':'नमस्कार','kya':'क्या','hai':'है','hain':'हैं',
  'mein':'में','main':'मैं','aur':'और','ka':'का','ki':'की','ke':'के',
  'yeh':'यह','woh':'वह','toh':'तो','se':'से','par':'पर','ko':'को',
  'nahi':'नहीं','nahin':'नहीं','accha':'अच्छा','acha':'अच्छा',
  'theek':'ठीक','thik':'ठीक','kaise':'कैसे','kyon':'क्यों',
  'kahan':'कहाँ','kab':'कब','hum':'हम','tum':'तुम','aap':'आप',
  'bahut':'बहुत','bohot':'बहुत','shukriya':'शुक्रिया','dhanyavad':'धन्यवाद',
  'zaroor':'ज़रूर','lekin':'लेकिन','magar':'मगर','isliye':'इसलिए',
  'kyunki':'क्योंकि','abhi':'अभी','pehle':'पहले','baad':'बाद','saath':'साथ',
  'dont':"don't",'doesnt':"doesn't",'cant':"can't",'wont':"won't",
  'im':"I'm",'ive':"I've",'thats':"that's",'whats':"what's",
  'lets':"let's",'theyre':"they're",'were':"we're",'youre':"you're",
  'wouldnt':"wouldn't",'shouldnt':"shouldn't",'couldnt':"couldn't",
  'didnt':"didn't",'wasnt':"wasn't",'isnt':"isn't",'arent':"aren't",
};

function autoCorrect(text){
  if(!autoCorrectOn)return text;
  let changed=false;
  const parts=text.split(/(\s+)/);
  const res=parts.map(w=>{
    if(/^\s+$/.test(w))return w;
    const low=w.toLowerCase().replace(/[.,!?।]+$/,'');
    const punc=w.slice(low.length);
    if(corrections[low]){changed=true;return corrections[low]+punc;}
    return w;
  });
  let out=res.join('');
  out=out.replace(/(^|[.!?।]\s+)([a-z])/g,(m,p,c)=>p+c.toUpperCase());
  if(out.length>0&&/[a-z]/.test(out[0]))out=out[0].toUpperCase()+out.slice(1);
  if(changed)showToast('✨ Auto-corrected');
  return out;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){setStatus('error','Browser support nahi! Edge mein kholein.');}

function buildRec(){
  const r=new SR();r.lang=currentLang;r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  r.onresult=(e)=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)final+=t;else interim+=t;
    }
    if(final){
      const corrected=autoCorrect(final);
      history.push(fullText);if(history.length>50)history.shift();
      const sep=(fullText&&!fullText.endsWith(' ')&&!fullText.endsWith('\n'))?' ':'';
      fullText+=sep+corrected;
      document.getElementById('transcript').value=fullText;
      updateCount();scrollBot();
      document.getElementById('liveText').textContent='✓ '+corrected.substring(0,50);
      document.getElementById('liveText').style.color='#22c55e';
    }
    if(interim){
      document.getElementById('liveText').textContent=interim;
      document.getElementById('liveText').style.color='#f59e0b';
    }
  };
  r.onerror=(e)=>{if(e.error==='not-allowed'){setStatus('error','Mic blocked! Lock icon→Allow');stopListen();}};
  r.onend=()=>{if(isListening)setTimeout(()=>{if(isListening){try{recognition=buildRec();recognition.start();}catch(e){}}},100);};
  return r;
}

function toggleMic(){if(isListening)stopListen();else startListen();}
function startListen(){
  if(!SR)return;isListening=true;recognition=buildRec();
  try{recognition.start();}catch(e){return;}
  document.getElementById('micBtn').textContent='⏹ Rokein';
  document.getElementById('micBtn').classList.add('recording');
  setStatus('listening','Sun raha hoon... bolte rahein');
  document.getElementById('liveText').textContent='Bol sakte hain...';
  document.getElementById('liveText').style.color='#22c55e';
  startTimer();
}
function stopListen(){
  isListening=false;if(recognition)try{recognition.stop();}catch(e){}
  document.getElementById('micBtn').textContent='🎤 Bolein';
  document.getElementById('micBtn').classList.remove('recording');
  setStatus('ready','Done — Edit, Copy, ya dobara bolein');
  document.getElementById('liveText').textContent='';stopTimer();
}
function setStatus(s,t){
  document.getElementById('statusDot').className='status-dot'+(s==='listening'?' listening':s==='error'?' error':'');
  document.getElementById('statusText').textContent=t;
}
function setLang(l){currentLang=l;document.getElementById('btnHi').className='lang-btn'+(l==='hi-IN'?' active':'');document.getElementById('btnEn').className='lang-btn'+(l==='en-US'?' active':'');if(isListening){stopListen();startListen();}}
function toggleAutoCorrect(){autoCorrectOn=!autoCorrectOn;document.getElementById('autoCorrectBtn').className='tool-btn'+(autoCorrectOn?' active':'');showToast(autoCorrectOn?'✨ Auto-Correct ON':'Auto-Correct OFF');}
function addPunc(p){const ta=document.getElementById('transcript');const pos=ta.selectionStart;ta.value=ta.value.substring(0,pos)+p+ta.value.substring(pos);fullText=ta.value;ta.selectionStart=ta.selectionEnd=pos+p.length;ta.focus();updateCount();}
function undoLast(){if(!history.length)return;fullText=history.pop();document.getElementById('transcript').value=fullText;updateCount();showToast('↩ Undo');}
function copyAll(){const t=document.getElementById('transcript').value;if(!t.trim())return;navigator.clipboard.writeText(t);document.getElementById('copyBtn').textContent='✅ Copied!';setTimeout(()=>{document.getElementById('copyBtn').textContent='📋 Copy';},2000);}
function clearAll(){history.push(fullText);fullText='';document.getElementById('transcript').value='';updateCount();document.getElementById('liveText').textContent='';}
function updateCount(){const t=fullText.trim();const w=t?t.split(/\s+/).length:0;document.getElementById('wordCount').textContent=w+' words | '+fullText.length+' chars';}
function scrollBot(){const ta=document.getElementById('transcript');ta.scrollTop=ta.scrollHeight;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.getElementById('transcript').addEventListener('input',function(){fullText=this.value;updateCount();});
function startTimer(){timerSec=0;timerInterval=setInterval(()=>{timerSec++;const m=Math.floor(timerSec/60),s=timerSec%60;document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;document.getElementById('timer').style.color='#ef4444';},1000);}
function stopTimer(){clearInterval(timerInterval);document.getElementById('timer').style.color='#4a5568';}
document.addEventListener('keydown',(e)=>{if(e.target.tagName==='TEXTAREA'){if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoLast();}return;}if(e.code==='Space'){e.preventDefault();toggleMic();}if(e.ctrlKey&&e.key==='z'){e.preventDefault();undoLast();}});
</script>
</body>
</html>
