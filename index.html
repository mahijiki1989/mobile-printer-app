<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdvPrint - Mobile Print Master</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="logo">
                <i class="fa-solid fa-print"></i>
                <span>AdvPrint Mobile</span>
            </div>
            <div class="actions">
                <a href="strategy.html" class="btn primary-btn" style="margin-right:0.5rem; text-decoration:none">
                    <i class="fa-solid fa-chart-line"></i> RSI Strategy
                </a>
                <label for="file-upload" class="btn primary-btn">
                    <i class="fa-solid fa-folder-open"></i> Open HTML
                </label>
                <input type="file" id="file-upload" accept=".html,.htm" hidden>
            </div>
        </header>

        <!-- Main Content (Preview) -->
        <main class="preview-container">
            <div id="no-file-msg" class="empty-state">
                <i class="fa-solid fa-file-code"></i>
                <p>Advanced Printer<br><small>Open any HTML file to start previewing desktop-like print in mobile.</small></p>
            </div>
            <iframe id="preview-frame" title="Print Preview"></iframe>
        </main>

        <!-- Settings Drawer Overlay -->
        <div id="settings-backdrop" class="backdrop"></div>

        <!-- Print Settings Drawer -->
        <aside id="settings-drawer" class="settings-drawer glass-panel">
            <div class="drawer-handle"></div>
            <h3><i class="fa-solid fa-sliders"></i> Print Settings</h3>
            
            <div class="setting-group">
                <label for="print-scale">Scale: <span id="scale-val">100%</span></label>
                <input type="range" id="print-scale" min="10" max="200" value="100">
            </div>

            <div class="setting-group">
                <label>Margins (cm)</label>
                <div class="margin-grid">
                    <div>
                        <label>Top</label>
                        <input type="number" id="margin-top" value="1" step="0.5">
                    </div>
                    <div>
                        <label>Right</label>
                        <input type="number" id="margin-right" value="1" step="0.5">
                    </div>
                    <div>
                        <label>Bottom</label>
                        <input type="number" id="margin-bottom" value="1" step="0.5">
                    </div>
                    <div>
                        <label>Left</label>
                        <input type="number" id="margin-left" value="1" step="0.5">
                    </div>
                </div>
            </div>
            
            <div class="setting-group toggle-group">
                <label for="background-graphics">Print Background Graphics</label>
                <label class="switch">
                  <input type="checkbox" id="background-graphics" checked>
                  <span class="slider round"></span>
                </label>
            </div>

            <button id="btn-print" class="btn action-btn">
                <i class="fa-solid fa-file-pdf"></i> Save as PDF
            </button>
        </aside>

        <!-- Floating Action Button for Settings on Mobile -->
        <button id="fab-settings" class="fab" aria-label="Settings">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW setup failed'));
      }
    </script>
</body>
</html>
