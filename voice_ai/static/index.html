<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice AI — Hindi & English</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-microphone-lines"></i></div>
        <div>
          <h1>Voice AI</h1>
          <p>Hindi &amp; English • Free &amp; Local</p>
        </div>
      </div>
      <div class="status-bar">
        <span class="status-dot" id="ollamaStatus"></span>
        <span id="ollamaLabel">Ollama जांच रहे हैं...</span>
      </div>
    </header>

    <!-- Chat Window -->
    <main class="chat-window" id="chatWindow">
      <div class="welcome-msg" id="welcomeMsg">
        <div class="welcome-icon"><i class="fa-solid fa-robot"></i></div>
        <h2>नमस्ते! 👋</h2>
        <p>नीचे बटन दबाएँ और बोलना शुरू करें।<br/>
        Hindi या English — दोनों चलेंगे!</p>
        <div class="welcome-tips">
          <span><i class="fa-solid fa-circle-info"></i> लंबी बात भी कर सकते हैं</span>
          <span><i class="fa-solid fa-language"></i> Auto language detect</span>
          <span><i class="fa-solid fa-volume-high"></i> जवाब सुन भी सकते हैं</span>
        </div>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls">

      <!-- Transcript preview -->
      <div class="transcript-box" id="transcriptBox">
        <span id="transcriptText">यहाँ आपकी आवाज़ लिखकर आएगी...</span>
        <button class="copy-btn" id="copyTranscript" title="Copy" style="display:none">
          <i class="fa-regular fa-copy"></i>
        </button>
      </div>

      <!-- Buttons -->
      <div class="btn-row">

        <!-- Record Button -->
        <button class="mic-btn" id="micBtn" title="Hold to record / Click to start">
          <div class="mic-rings" id="micRings"></div>
          <i class="fa-solid fa-microphone" id="micIcon"></i>
          <span id="micLabel">बोलें</span>
        </button>

        <!-- Send to AI -->
        <button class="action-btn send-btn" id="sendBtn" title="AI से पूछें" disabled>
          <i class="fa-solid fa-paper-plane"></i>
          <span>AI से पूछें</span>
        </button>

        <!-- Speak response -->
        <button class="action-btn speak-btn" id="speakBtn" title="जवाब सुनें" disabled>
          <i class="fa-solid fa-volume-high"></i>
          <span>सुनें</span>
        </button>

        <!-- Clear chat -->
        <button class="action-btn clear-btn" id="clearBtn" title="Chat साफ करें">
          <i class="fa-solid fa-trash-can"></i>
        </button>

      </div>

      <!-- Recording timer -->
      <div class="timer" id="timer" style="display:none">
        <i class="fa-solid fa-circle recording-pulse"></i>
        Recording: <span id="timerDisplay">0:00</span>
      </div>

    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
