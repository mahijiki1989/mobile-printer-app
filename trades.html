<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Interactive Trade Walkthrough - RSI Strategy</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0e1a;
  --panel: #111827;
  --panel2: #1a2235;
  --border: #1e3a5f;
  --green: #00e676;
  --red: #ff1744;
  --blue: #2196f3;
  --gold: #ffc107;
  --orange: #ff9800;
  --cyan: #00bcd4;
  --purple: #9c27b0;
  --text: #e2e8f0;
  --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* ============== HERO ============== */
.hero {
  background: linear-gradient(135deg, #0d1f35 0%, #0a1628 100%);
  padding: 2rem 1.5rem;
  text-align: center;
  border-bottom: 2px solid var(--border);
}
.hero h1 {
  font-size: clamp(1.5rem, 4vw, 2.4rem);
  font-weight: 800;
  background: linear-gradient(135deg, #00e676, #2196f3, #ffc107);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.hero p { color: var(--muted); font-size: 0.95rem; }
.back-link {
  display: inline-block;
  margin-top: 0.75rem;
  color: var(--cyan);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 0.4rem 1rem;
  border: 1px solid var(--cyan);
  border-radius: 50px;
}
.back-link:hover { background: rgba(0,188,212,0.1); }

.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

/* ============== TRADE TABS ============== */
.tab-bar {
  display: flex;
  gap: 0.5rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0.4rem;
  margin-bottom: 1.5rem;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-btn {
  flex: 1;
  min-width: 120px;
  padding: 0.7rem 0.8rem;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover { background: rgba(33,150,243,0.08); color: var(--text); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--blue), var(--cyan));
  color: white;
  box-shadow: 0 4px 14px rgba(33,150,243,0.4);
}

/* ============== TRADE PANEL ============== */
.trade-panel {
  display: none;
  animation: fadeIn 0.4s ease;
}
.trade-panel.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============== TRADE HEADER ============== */
.trade-header {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.trade-title { font-size: 1.15rem; font-weight: 700; }
.trade-title small { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-top: 0.2rem; }
.trade-tag {
  padding: 0.4rem 1rem;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 700;
}
.tag-win { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid var(--green); }
.tag-loss { background: rgba(255,23,68,0.15); color: var(--red); border: 1px solid var(--red); }
.tag-tg2 { background: rgba(255,193,7,0.15); color: var(--gold); border: 1px solid var(--gold); }

/* ============== CHART AREA ============== */
.chart-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.chart-card h3 {
  font-size: 1rem;
  color: var(--cyan);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
canvas { width: 100% !important; }

/* ============== STEP CONTROLS ============== */
.controls {
  background: linear-gradient(135deg, #0d1f35, #0a1628);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.btn-row {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.btn {
  padding: 0.7rem 1.2rem;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-play { background: linear-gradient(135deg, var(--green), #00c853); color: #002912; }
.btn-play:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,230,118,0.4); }
.btn-prev, .btn-next { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
.btn-prev:hover, .btn-next:hover { border-color: var(--blue); background: rgba(33,150,243,0.1); }
.btn-reset { background: rgba(255,23,68,0.1); color: var(--red); border: 1px solid var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.progress {
  display: flex;
  gap: 0.4rem;
  margin-bottom: 1rem;
}
.dot {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  transition: background 0.3s;
}
.dot.done { background: linear-gradient(90deg, var(--green), var(--cyan)); }
.dot.current { background: linear-gradient(90deg, var(--gold), var(--orange)); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ============== STEP NARRATION ============== */
.step-box {
  background: var(--panel2);
  border-radius: 12px;
  padding: 1.25rem;
  border-left: 4px solid var(--gold);
  min-height: 120px;
  transition: border-color 0.3s;
}
.step-box.entry-step { border-left-color: var(--blue); }
.step-box.sl-step { border-left-color: var(--red); }
.step-box.tg-step { border-left-color: var(--green); }
.step-box.rsi-step { border-left-color: var(--orange); }
.step-num {
  display: inline-block;
  padding: 0.2rem 0.7rem;
  background: rgba(255,193,7,0.15);
  color: var(--gold);
  border-radius: 50px;
  font-size: 0.78rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.step-title {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: var(--text);
}
.step-desc {
  color: var(--muted);
  font-size: 0.93rem;
  margin-bottom: 0.6rem;
}
.step-data {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.6rem;
}
.data-pill {
  padding: 0.3rem 0.8rem;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 600;
  background: rgba(33,150,243,0.1);
  border: 1px solid var(--blue);
  color: var(--blue);
}
.data-pill.green { background: rgba(0,230,118,0.1); border-color: var(--green); color: var(--green); }
.data-pill.red { background: rgba(255,23,68,0.1); border-color: var(--red); color: var(--red); }
.data-pill.gold { background: rgba(255,193,7,0.1); border-color: var(--gold); color: var(--gold); }
.data-pill.orange { background: rgba(255,152,0,0.1); border-color: var(--orange); color: var(--orange); }

/* ============== TRADE SUMMARY ============== */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}
.sum-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.9rem;
  text-align: center;
}
.sum-box .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.sum-box .val { font-size: 1.15rem; font-weight: 800; margin-top: 0.2rem; }
.sum-entry .val { color: var(--blue); }
.sum-sl    .val { color: var(--red); }
.sum-t1    .val { color: var(--green); }
.sum-t2    .val { color: var(--gold); }
.sum-pnl   { background: linear-gradient(135deg, rgba(0,230,118,0.1), rgba(0,188,212,0.1)); border-color: var(--green); }
.sum-pnl.loss-pnl { background: linear-gradient(135deg, rgba(255,23,68,0.1), rgba(255,152,0,0.1)); border-color: var(--red); }
.sum-pnl .val { color: var(--green); }
.sum-pnl.loss-pnl .val { color: var(--red); }

footer {
  text-align: center;
  padding: 1.5rem;
  color: var(--muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
}
</style>
</head>

// ============================================
// RENDER + INTERACTIVITY
// ============================================
const container = document.getElementById('tradeContainer');
const tabBar = document.getElementById('tabBar');
const charts = {};
const states = {}; // trade index -> { currentStep, isPlaying, intervalId }

// Build all panels
TRADES.forEach((trade, idx) => {
  const panel = document.createElement('div');
  panel.className = 'trade-panel' + (idx === 0 ? ' active' : '');
  panel.dataset.idx = idx;
  panel.innerHTML = `
    <div class="trade-header">
      <div class="trade-title">${trade.title}<small>${trade.subtitle}</small></div>
      <span class="trade-tag ${trade.tagClass}">${trade.tag}</span>
    </div>

    <div class="chart-card">
      <h3>📈 Live Chart — Price + RSI Animation</h3>
      <div style="position:relative; height:380px"><canvas id="chart-${idx}"></canvas></div>
    </div>

    <div class="controls">
      <div class="progress" id="progress-${idx}"></div>
      <div class="btn-row">
        <button class="btn btn-play" data-action="play" data-idx="${idx}">▶ Play Animation</button>
        <button class="btn btn-prev" data-action="prev" data-idx="${idx}">◀ Previous</button>
        <button class="btn btn-next" data-action="next" data-idx="${idx}">Next ▶</button>
        <button class="btn btn-reset" data-action="reset" data-idx="${idx}">↻ Reset</button>
      </div>
      <div class="step-box" id="step-${idx}">
        <span class="step-num">Step 1 / ${trade.steps.length}</span>
        <div class="step-title">Click "Play Animation" to start</div>
        <div class="step-desc">Animation chalu karne pe trade ki har choti se choti baat samajh aayegi — entry, SL, target sab kuch step-by-step.</div>
      </div>
    </div>

    <div class="summary">
      <div class="sum-box sum-entry"><div class="lbl">Entry</div><div class="val">₹${trade.entry.toLocaleString()}</div></div>
      <div class="sum-box sum-sl"><div class="lbl">Stop Loss</div><div class="val">₹${trade.sl.toLocaleString()}</div></div>
      <div class="sum-box sum-t1"><div class="lbl">Target 1</div><div class="val">₹${trade.t1.toLocaleString()}</div></div>
      <div class="sum-box sum-t2"><div class="lbl">Target 2</div><div class="val">₹${trade.t2.toLocaleString()}</div></div>
      <div class="sum-box sum-pnl ${trade.pnlClass}"><div class="lbl">P&amp;L</div><div class="val">${trade.pnl}</div></div>
    </div>
  `;
  container.appendChild(panel);

  // build progress dots
  const prog = panel.querySelector('#progress-' + idx);
  trade.steps.forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot';
    prog.appendChild(d);
  });

  states[idx] = { step: -1, playing: false, interval: null };
});

// TAB SWITCHING
tabBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const idx = +btn.dataset.trade;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.trade-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.trade-panel[data-idx="${idx}"]`).classList.add('active');
  // ensure chart exists for this trade
  if (!charts[idx]) buildChart(idx);
});

// BUTTONS (delegated)
container.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  const idx = +btn.dataset.idx;
  const action = btn.dataset.action;
  if (action === 'play') togglePlay(idx);
  if (action === 'prev') goPrev(idx);
  if (action === 'next') goNext(idx);
  if (action === 'reset') reset(idx);
});

function togglePlay(idx) {
  const s = states[idx];
  if (s.playing) {
    clearInterval(s.interval);
    s.playing = false;
    updatePlayBtn(idx);
    return;
  }
  s.playing = true;
  updatePlayBtn(idx);
  s.interval = setInterval(() => {
    if (s.step >= TRADES[idx].steps.length - 1) {
      clearInterval(s.interval);
      s.playing = false;
      updatePlayBtn(idx);
      return;
    }
    goNext(idx);
  }, 3500);
  // start immediately
  if (s.step < 0) goNext(idx);
}

function updatePlayBtn(idx) {
  const btn = document.querySelector(`.btn-play[data-idx="${idx}"]`);
  btn.textContent = states[idx].playing ? '⏸ Pause' : '▶ Play Animation';
}

function goNext(idx) {
  const s = states[idx];
  if (s.step >= TRADES[idx].steps.length - 1) return;
  s.step++;
  renderStep(idx);
}

function goPrev(idx) {
  const s = states[idx];
  if (s.step <= 0) return;
  s.step--;
  renderStep(idx);
}

function reset(idx) {
  const s = states[idx];
  clearInterval(s.interval);
  s.playing = false;
  s.step = -1;
  updatePlayBtn(idx);
  // reset progress dots
  document.querySelectorAll(`#progress-${idx} .dot`).forEach(d => d.className = 'dot');
  // reset step text
  const trade = TRADES[idx];
  const stepBox = document.getElementById('step-' + idx);
  stepBox.className = 'step-box';
  stepBox.innerHTML = `
    <span class="step-num">Step 1 / ${trade.steps.length}</span>
    <div class="step-title">Click "Play Animation" to start</div>
    <div class="step-desc">Animation chalu karne pe trade ki har choti se choti baat samajh aayegi.</div>
  `;
  // rebuild chart with no data
  if (charts[idx]) {
    charts[idx].destroy();
    delete charts[idx];
  }
  buildChart(idx);
}

function renderStep(idx) {
  const trade = TRADES[idx];
  const s = states[idx];
  const step = trade.steps[s.step];

  // update progress dots
  const dots = document.querySelectorAll(`#progress-${idx} .dot`);
  dots.forEach((d, i) => {
    d.className = 'dot' + (i < s.step ? ' done' : i === s.step ? ' current' : '');
  });

  // update step text
  const stepBox = document.getElementById('step-' + idx);
  stepBox.className = 'step-box ' + step.type;
  const pillsHtml = (step.pills || []).map(p =>
    `<span class="data-pill ${p[2]||''}"><b>${p[0]}:</b>&nbsp;${p[1]}</span>`
  ).join('');
  stepBox.innerHTML = `
    <span class="step-num">Step ${s.step + 1} / ${trade.steps.length}</span>
    <div class="step-title">${step.title}</div>
    <div class="step-desc">${step.desc}</div>
    <div class="step-data">${pillsHtml}</div>
  `;

  // update chart with revealed data range
  updateChart(idx, step);
}

function buildChart(idx) {
  const trade = TRADES[idx];
  const ctx = document.getElementById('chart-' + idx).getContext('2d');
  charts[idx] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: trade.labels,
      datasets: [
        {
          label: 'Nifty Price', data: [], borderColor: '#2196f3',
          backgroundColor: 'rgba(33,150,243,0.1)', tension: 0.3, yAxisID: 'y',
          borderWidth: 3, pointRadius: 4, pointBackgroundColor: '#2196f3', fill: true
        },
        {
          label: 'RSI (14)', data: [], borderColor: '#ff9800',
          backgroundColor: 'rgba(255,152,0,0.05)', tension: 0.3, yAxisID: 'y1',
          borderWidth: 2, pointRadius: 3, borderDash: [6,3]
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 600 },
      plugins: {
        legend: { labels: { color: '#e2e8f0' } },
        tooltip: { backgroundColor: '#1a2235', borderColor: '#1e3a5f', borderWidth: 1 }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(30,58,95,0.3)' } },
        y: {
          position: 'left', title: { display: true, text: 'Price (₹)', color: '#2196f3' },
          ticks: { color: '#94a3b8' }, grid: { color: 'rgba(30,58,95,0.3)' }
        },
        y1: {
          position: 'right', min: 0, max: 100,
          title: { display: true, text: 'RSI', color: '#ff9800' },
          ticks: { color: '#94a3b8', stepSize: 20 }, grid: { drawOnChartArea: false }
        }
      }
    },
    plugins: [makeOverlayPlugin(idx)]
  });
}

function makeOverlayPlugin(idx) {
  return {
    id: 'overlay-' + idx,
    afterDraw(chart) {
      const s = states[idx];
      if (s.step < 0) return;
      const trade = TRADES[idx];
      const step = trade.steps[s.step];
      const { ctx, chartArea: { left, right, top, bottom }, scales: { y, y1, x } } = chart;

      // Always draw RSI 60 reference line
      ctx.save();
      const y60 = y1.getPixelForValue(60);
      ctx.strokeStyle = '#ffd600';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 4]);
      ctx.beginPath();
      ctx.moveTo(left, y60); ctx.lineTo(right, y60); ctx.stroke();
      ctx.fillStyle = '#ffd600';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('RSI 60 (Magic Line)', left + 6, y60 - 4);

      // Draw price levels based on step type / progress
      const showEntry = ['entry-step','sl-step','tg-step'].includes(step.type) || s.step >= 3;
      const showSL    = ['sl-step','tg-step'].includes(step.type) || s.step >= 4;
      const showT1    = ['tg-step'].includes(step.type) || s.step >= 5;
      const showT2    = ['tg-step'].includes(step.type) && s.step >= 6;

      const drawLine = (val, color, label, dash=[6,4]) => {
        const yp = y.getPixelForValue(val);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(left, yp); ctx.lineTo(right, yp); ctx.stroke();
        ctx.fillStyle = color; ctx.font = 'bold 11px sans-serif';
        ctx.fillText(label, right - 145, yp - 4);
      };

      if (showEntry) drawLine(trade.entry, '#2196f3', '🔵 ENTRY ₹' + trade.entry.toLocaleString(), []);
      if (showSL)    drawLine(trade.sl, '#ff1744', '🔴 STOP LOSS ₹' + trade.sl.toLocaleString());
      if (showT1)    drawLine(trade.t1, '#00e676', '🟢 TARGET 1 ₹' + trade.t1.toLocaleString());
      if (showT2)    drawLine(trade.t2, '#ffd600', '🟡 TARGET 2 ₹' + trade.t2.toLocaleString());

      // Highlight specific candle (entry, sl-hit, target-hit)
      if (step.highlight !== undefined) {
        const xPos = x.getPixelForValue(step.highlight);
        const labelMap = {
          'entry-step': { color:'#2196f3', label:'⬇ ENTRY HERE' },
          'sl-step':    { color:'#ff1744', label:'⬇ SL HIT' },
          'tg-step':    { color:'#00e676', label:'⬇ TARGET HIT' }
        };
        const info = labelMap[step.type] || { color:'#ffc107', label:'⬇ EVENT' };
        ctx.strokeStyle = info.color; ctx.lineWidth = 2; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(xPos, top + 30); ctx.lineTo(xPos, bottom); ctx.stroke();
        ctx.fillStyle = info.color; ctx.font = 'bold 12px sans-serif';
        ctx.fillText(info.label, xPos - 36, top + 22);

        // Draw highlight circle on price point
        const py = y.getPixelForValue(trade.price[step.highlight]);
        ctx.fillStyle = info.color;
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(xPos, py, 9, 0, 2 * Math.PI); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(xPos, py, 4, 0, 2 * Math.PI); ctx.fill();
      }

      ctx.restore();
    }
  };
}

function updateChart(idx, step) {
  const trade = TRADES[idx];
  const chart = charts[idx];
  const [start, end] = step.range;
  // Reveal data progressively up to `end` index
  const maskedPrice = trade.price.map((v, i) => (i <= end ? v : null));
  const maskedRsi   = trade.rsi.map((v, i) => (i <= end ? v : null));
  chart.data.datasets[0].data = maskedPrice;
  chart.data.datasets[1].data = maskedRsi;
  chart.update();
}

// Init: build chart for first (active) trade
buildChart(0);
</script>
